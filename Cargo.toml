[package]
name = "sqdist"
version = "0.1.0"
edition = "2021"
description = "Fast string-distance CLI for typosquatting and homoglyph detection (Levenshtein, Damerau-Levenshtein, UTS#39 confusable-weighted)."
license = "MIT OR Apache-2.0"

[[bin]]
name = "sqdist"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
